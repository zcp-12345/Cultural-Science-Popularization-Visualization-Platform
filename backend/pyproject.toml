[project]
name = "digital-archaeology-lens-backend"
version = "0.1.0"
description = "数字考古透视镜 · Phase 2 后端（FastAPI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # M3 用户系统：
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

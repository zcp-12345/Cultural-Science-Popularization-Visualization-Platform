# 香港自托管部署：PostgreSQL + 后端 FastAPI + Caddy（自动 HTTPS）
# 用法：
#   1) cd deploy
#   2) cp .env.example .env  并填好 .env（域名 / 密码 / AI 密钥）
#   3) docker compose up -d --build
# 前端（Cloudflare Pages）把 VITE_API_BASE_URL 指向 https://<API_DOMAIN>/api/v1 即可。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请填 deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-archaeology}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-archaeology}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-archaeology}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请填 deploy/.env}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "none"
      CORS_ORIGINS: '["https://cultural-science-popularization-visualization-platform.pages.dev","https://cultural-science-popularization-visualization-platfo-eitb8q9xo.vercel.app"]'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY 未设置，请填 deploy/.env}
      AI_ENABLED: "true"
      EMBEDDING_PROVIDER: cloud
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY 未设置，请填 deploy/.env}
      AI_RATE_LIMIT_REQUESTS: "10"
      AI_RATE_LIMIT_TRUST_XFF: "true"
    volumes:
      - chroma:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN 未设置，请填 deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  chroma:
  caddy_data:
  caddy_config:

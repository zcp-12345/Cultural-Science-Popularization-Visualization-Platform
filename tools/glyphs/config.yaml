# 汉字演变时间轴 · 真实字形构建配置
# 用法：python tools/glyphs/build_glyphs.py
#
# 关键约定：oracle/bronze/seal/clerical/regular 五栏查「繁体」字形（龍/馬），
# 仅 simplified 查「简体」本身（龙/马）。中/日/水 无繁简之分，两者同形。

characters:
  - char: 中
    query: { oracle: 中, bronze: 中, seal: 中, clerical: 中, regular: 中, simplified: 中 }
  - char: 龙
    query: { oracle: 龍, bronze: 龍, seal: 龍, clerical: 龍, regular: 龍, simplified: 龙 }
  - char: 马
    query: { oracle: 馬, bronze: 馬, seal: 馬, clerical: 馬, regular: 馬, simplified: 马 }
  - char: 日
    query: { oracle: 日, bronze: 日, seal: 日, clerical: 日, regular: 日, simplified: 日 }
  - char: 水
    query: { oracle: 水, bronze: 水, seal: 水, clerical: 水, regular: 水, simplified: 水 }

